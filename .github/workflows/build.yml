name: Build tweak

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install ldid dpkg make

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install iOS SDKs
        run: |
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/sdks
          mv /tmp/sdks/*.sdk "$HOME/theos/sdks/"

      - name: Show repo contents
        run: |
          find . -not -path './.git/*' -type f | sort
          gmake --version | head -1

      - name: Build
        run: |
          MK=$(find . -name Makefile -not -path './.git/*' | head -1)
          if [ -z "$MK" ]; then
            echo "::error::No Makefile found in the repo."
            exit 1
          fi
          cd "$(dirname "$MK")"
          gmake package FINALPACKAGE=1

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: ResoTweak-deb
          path: '**/packages/*.deb'
